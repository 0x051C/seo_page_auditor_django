<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SEO Page Auditor{% endblock %}</title>
  <style>
    :root { --text: #1f2328; --muted: #59636e; --border: #d1d9e0; --bg-alt: #f6f8fa; --link: #0969da; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); }
    header.top { border-bottom: 1px solid var(--border); padding: 12px 32px; background: var(--bg-alt); }
    header.top a { color: var(--text); font-weight: 600; text-decoration: none; }
    main { max-width: 1200px; margin: 0 auto; padding: 24px 32px 48px; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    a { color: var(--link); }
    .muted { color: var(--muted); }
    .summary { display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 16px 0 24px; padding: 12px 16px;
               border: 1px solid var(--border); border-radius: 6px; background: var(--bg-alt); }
    .summary strong { font-variant-numeric: tabular-nums; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { font-size: 13px; color: var(--muted); font-weight: 600; white-space: nowrap; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    td.page { min-width: 240px; max-width: 320px; overflow-wrap: anywhere; }
    td.detail { color: var(--muted); font-size: 14px; }
    .badge { display: inline-block; min-width: 64px; padding: 1px 8px; border-radius: 999px; font-size: 13px;
             font-weight: 600; text-align: center; border: 1px solid transparent; }
    .badge-high { background: #ffebe9; color: #a40e26; border-color: #ffcecb; }
    .badge-medium { background: #fff8c5; color: #7d4e00; border-color: #f5e0a0; }
    .badge-low { background: #f6f8fa; color: #59636e; border-color: #d1d9e0; }
    .rule { font-weight: 600; white-space: nowrap; }
  </style>
</head>
<body>
  <header class="top"><a href="{% url 'audit:site-list' %}">SEO Page Auditor</a></header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
